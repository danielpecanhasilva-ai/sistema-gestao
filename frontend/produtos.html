<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Produtos — Sistema de Gestão</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topo">
    <h1>Sistema de Gestão</h1>
    <span class="pagina">Produtos</span>
  </header>

  <main class="conteudo">
    <section class="cartao">
      <h2 id="titulo-form">Novo produto</h2>
      <form id="form-produto" novalidate>
        <input type="hidden" id="produto-id">
        <div class="grade">
          <label>Nome *
            <input type="text" id="nome" maxlength="100" required>
          </label>
          <label>Categoria
            <input type="text" id="categoria" maxlength="50">
          </label>
          <label>Preço (R$) *
            <input type="number" id="preco" step="0.01" min="0.01" required>
          </label>
          <label>Estoque *
            <input type="number" id="estoque" step="1" min="0" required>
          </label>
          <label>Estoque mínimo
            <input type="number" id="estoque_minimo" step="1" min="0" value="5">
          </label>
        </div>
        <div class="acoes">
          <button type="submit" class="btn btn-principal" id="btn-salvar">Salvar</button>
          <button type="button" class="btn" id="btn-cancelar" hidden>Cancelar edição</button>
        </div>
        <p id="mensagem" role="alert"></p>
      </form>
    </section>

    <section class="cartao">
      <div class="barra">
        <h2>Lista de produtos</h2>
        <div class="filtros">
          <input type="search" id="busca" placeholder="Buscar por nome ou categoria">
          <label class="check"><input type="checkbox" id="todos"> Mostrar inativos</label>
        </div>
      </div>
      <div class="tabela-wrap">
        <table>
          <thead>
            <tr>
              <th>Nome</th><th>Categoria</th><th class="num">Preço</th>
              <th class="num">Estoque</th><th class="num">Mínimo</th><th>Ações</th>
            </tr>
          </thead>
          <tbody id="lista"></tbody>
        </table>
      </div>
      <p id="vazio" hidden>Nenhum produto encontrado.</p>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/produtos.js"></script>
</body>
</html>
